[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shoko-matcher"
version = "0.1.0"
description = "Find unrecognized files in Shoko Server and manually link them to episodes via the Shoko v3 REST API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=7.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
shoko-matcher = "shoko_matcher.cli:main"
shoko-matcher-web = "shoko_matcher.webapp:run"

[tool.setuptools.packages.find]
include = ["shoko_matcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
